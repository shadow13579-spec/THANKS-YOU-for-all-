<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Page surprise</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
    background: #000;
  }

  /* ---------- FOND ETOILE (canvas statique, dessiné une fois) ---------- */
  #stars {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  #fireworks {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  /* ---------- SCENE 3D (le cercle de bulles/images) ---------- */
  #stage {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    perspective: 900px;       /* donne la profondeur 3D */
    overflow: hidden;
  }
  #ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    transform-style: preserve-3d; /* les enfants gardent leur position 3D */
  }
  .ring-item {
    position: absolute;
    top: 0; left: 0;
    transform-style: preserve-3d;
    backface-visibility: hidden;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .ring-bubble {
    padding: 14px 20px;
    background: rgba(20, 30, 45, 0.55);
    border: 1px solid #4fd1ff;
    border-radius: 28px;
    color: #eaffff;
    font-size: 22px;
    font-weight: 700;
    white-space: normal;
    max-width: 250px;
    text-align: center;
    box-sizing: border-box;
    box-shadow: 0 0 8px #4fd1ff, 0 0 16px rgba(79, 209, 255, 0.5);
    text-shadow: 0 0 6px #4fd1ff;
  }
  .ring-image {
    width: 170px;
    height: 170px;
    border-radius: 16px;
    object-fit: cover;
    border: 2px solid #4fd1ff;
    box-shadow: 0 0 12px #4fd1ff;
  }

  /* ---------- COUNTDOWN (bleu néon) ---------- */
  #countdown {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 8rem;
    font-weight: 800;
    color: #4fd1ff;
    text-shadow: 0 0 20px #4fd1ff, 0 0 40px #2ea8e0;
    z-index: 4;
    transition: opacity 0.3s ease;
  }
  .pulse { animation: pulse 0.5s ease; }
  @keyframes pulse {
    0%   { transform: translate(-50%,-50%) scale(0.5); opacity: 0; }
    50%  { transform: translate(-50%,-50%) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  }

  /* ---------- MESSAGE PRINCIPAL ---------- */
  #main-message {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 85%;
    text-align: center;
    font-size: 2.2rem;
    font-weight: 700;
    color: #eaffff;
    text-shadow: 0 0 12px #4fd1ff, 0 0 24px #4fd1ff;
    z-index: 4;
    opacity: 0;
    transition: opacity 3s ease;
  }
  #main-message.show { opacity: 1; transition: opacity 0.8s ease; }
  #main-message.fade-out { opacity: 0; transition: opacity 3s ease; }

  /* ---------- ECRAN START ---------- */
  #start-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity 0.8s ease;
  }
  #start-btn {
    padding: 18px 50px;
    font-size: 1.6rem;
    font-weight: 700;
    color: #eaffff;
    background: rgba(20,30,45,0.6);
    border: 2px solid #4fd1ff;
    border-radius: 999px;
    box-shadow: 0 0 15px #4fd1ff;
    text-shadow: 0 0 8px #4fd1ff;
    cursor: pointer;
  }

  /* ---------- ECRAN DE CLOTURE ---------- */
  #closing-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    background: rgba(0,0,0,0.35);
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s ease;
  }
  #closing-screen.show { opacity: 1; pointer-events: auto; }
  #closing-message {
    width: 85%;
    text-align: center;
    font-size: 2rem;
    font-weight: 700;
    color: #eaffff;
    text-shadow: 0 0 12px #4fd1ff, 0 0 24px #4fd1ff;
  }
  #close-btn {
    padding: 12px 40px;
    font-size: 1.1rem;
    font-weight: 800;
    color: #eaffff;
    background: rgba(20,30,45,0.6);
    border: 2px solid #4fd1ff;
    border-radius: 999px;
    box-shadow: 0 0 12px #4fd1ff;
    cursor: pointer;
  }

  /* ---------- ECRAN NOIR FINAL ---------- */
  #final-black {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
  }
  #final-black.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

  <canvas id="stars"></canvas>
  <canvas id="fireworks"></canvas>

  <div id="stage">
    <div id="ring"></div>
  </div>

  <div id="countdown"></div>
  <div id="main-message">
    <!-- PLACEHOLDER : message principal -->
    Thank you forever.
    ,Nuray Thank you,🥰❤️
  </div>

  <div id="closing-screen">
    <div id="closing-message">
      <!-- PLACEHOLDER : message de clôture -->
      Artıq yoxa çıxmağın vaxtıdır.
      bu, həyatınızda sadəcə bir təcrübədir.
      və mənim rolum peyda olub yox olmaqdır .😆 lol
      . thanks you Nuray.
    </div>
    <button id="close-btn">Close</button>
  </div>

  <div id="start-screen">
    <button id="start-btn">Start</button>
  </div>

  <div id="final-black"></div>

  <!-- PLACEHOLDER : ta musique -->
  <audio id="bg-audio" src="Lovely___Billie_Eilish___Khalid._sad_song_💔😔___slowed___Lyrics___🖤(48k).m4a" loop></audio>

  <script>
    // ==================================================================
    // PLACEHOLDERS
    // ==================================================================
    // images utilisées comme vignettes flottantes DANS le cercle (plus en fond)
    const RING_IMAGES = [
      'IMG_20260809_135725_276.png', 'IMG_20260809_135637_764.png', 'image_ac4fbea5.png', '1.png', '2.png', '3.png', '4.png', '5.png', '6.jpeg', '8.jpg', '9.jpg'
    ];

    const BUBBLE_MESSAGES = [
      "Do you remember the first time we met 😁?",
      "Sən mənə ilk gündən hədiyyələr verdin 😂😂",
      "Sən elə bilirdin ki, mən Allahın sənin dualarına cavab olaraq göndərdiyi mələyəm 😂",
      "Bu oyunda səninlə yaşadıqlarım möhtəşəm idi.💗💗",
      "Bəlkə də mən dəliyəm. Onda məni dəli edən sən olmusan 😏.lol.",
      "Mənim üçün çox səy göstərdin, üstəlik, gec yatdın.😓😂",
      "universitet dərsləri olanda belə sən orada idin.😑😂 ",
      "Yadındadır, sərxoş olanda 😂. Həqiqətən necə olduğunu bilmirəm, amma hətta sərxoş halda belə yenə bu oyuna gəlib mənimlə danışdın.",
      "Sənə dəli olmuşam 🥰",
      "Qorxunc pişik olsan belə 😂. Bəli, fərq etdim.",
      "Amma təşəkkür edirəm.",
      "Bunu sənin ad günündə etmək istərdim.",
      "Gözəlim, sən mükəmməl idin.🥰 ,Etiraf edim ki, sən əsl qorxaq idin...",
      "O biri gün sadəcə bu xoşbəxtliyin keçici olduğunu bilməyini istədim. ",
      "Həmişəki kimi, bu gün bunu çox ciddi qəbul etdin. Və mənə qardaş deyə müraciət etdin 😑",
      "düz deyirsən Mən görünüb sonra yox olan insanlardan biriyəm.😊 lol",
      "Bitirmək istəmirdim, amma yaxşı idi."
    ];

    const SHOW_DURATION = 120;      // durée des feux d'artifice, en secondes
    const CLOSING_DELAY = 240;     // délai avant l'apparition du bouton Close, en secondes (4 min)

    // ==================================================================
    // ELEMENTS
    // ==================================================================
    const startScreen   = document.getElementById('start-screen');
    const startBtn       = document.getElementById('start-btn');
    const countdownEl    = document.getElementById('countdown');
    const mainMessageEl  = document.getElementById('main-message');
    const closingScreen  = document.getElementById('closing-screen');
    const closeBtn       = document.getElementById('close-btn');
    const finalBlack      = document.getElementById('final-black');
    const audio           = document.getElementById('bg-audio');
    const starsCanvas = document.getElementById('stars');
    const starsCtx = starsCanvas.getContext('2d');
    const fireworksCanvas = document.getElementById('fireworks');
    const ctx = fireworksCanvas.getContext('2d');
    const ring = document.getElementById('ring');

    let activeIntervals = [];
    let activeTimeouts = [];
    let animationFrameId = null;   // boucle des feux d'artifice
    let ringFrameId = null;        // boucle du cercle 3D

    function trackInterval(id) { activeIntervals.push(id); return id; }
    function trackTimeout(id)  { activeTimeouts.push(id); return id; }

    function stopEverything() {
      activeIntervals.forEach(clearInterval);
      activeTimeouts.forEach(clearTimeout);
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      if (ringFrameId) cancelAnimationFrame(ringFrameId);
      ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
      audio.pause();
    }

    // ==================================================================
    // FOND ETOILE (dessiné une seule fois, pas besoin de l'animer)
    // ==================================================================
    function drawStars() {
      starsCanvas.width = window.innerWidth;
      starsCanvas.height = window.innerHeight;
      starsCtx.fillStyle = '#000';
      starsCtx.fillRect(0, 0, starsCanvas.width, starsCanvas.height);
      // plus d'étoiles, et plus lumineuses en moyenne
      const starCount = Math.floor((starsCanvas.width * starsCanvas.height) / 1600);
      for (let i = 0; i < starCount; i++) {
        const x = Math.random() * starsCanvas.width;
        const y = Math.random() * starsCanvas.height;
        const isBright = Math.random() < 0.12; // une étoile sur ~8 est une "grosse" étoile avec halo
        const r = isBright ? Math.random() * 1.4 + 1.3 : Math.random() * 1.3 + 0.3;

        starsCtx.save();
        starsCtx.globalAlpha = isBright ? 1 : Math.random() * 0.5 + 0.5;
        starsCtx.fillStyle = '#ffffff';
        if (isBright) {
          starsCtx.shadowColor = '#bfe9ff';
          starsCtx.shadowBlur = 6;
        }
        starsCtx.beginPath();
        starsCtx.arc(x, y, r, 0, Math.PI * 2);
        starsCtx.fill();
        starsCtx.restore();
      }
      starsCtx.globalAlpha = 1;
    }
    drawStars();
    window.addEventListener('resize', drawStars);

    // ==================================================================
    // ECRAN START
    // ==================================================================
    startBtn.addEventListener('click', () => {
      audio.play().catch(() => {});
      startScreen.style.opacity = '0';
      trackTimeout(setTimeout(() => { startScreen.style.display = 'none'; }, 800));
      startSequence();
    });

    // ==================================================================
    // COUNTDOWN
    // ==================================================================
    function startSequence() {
      let count = 3;
      function tick() {
        if (count > 0) {
          countdownEl.textContent = count;
        } else {
          countdownEl.textContent = '';
          showMainMessage();
          return;
        }
        countdownEl.classList.remove('pulse');
        void countdownEl.offsetWidth;
        countdownEl.classList.add('pulse');
        count--;
        trackTimeout(setTimeout(tick, 1000));
      }
      tick();
    }

    function showMainMessage() {
      mainMessageEl.classList.add('show');

      startFireworksShow();
      startRing();

      trackTimeout(setTimeout(() => {
        mainMessageEl.classList.remove('show');
        mainMessageEl.classList.add('fade-out');
      }, 4000));

      trackTimeout(setTimeout(() => {
        closingScreen.classList.add('show');
      }, CLOSING_DELAY * 1000));
    }

    // ==================================================================
    // CERCLE 3D DE BULLES + IMAGES
    // ==================================================================
    // principe :
    //  - chaque élément (bulle ou image) est placé à un ANGLE fixe autour
    //    de l'axe vertical, à une distance RADIUS du centre (comme les
    //    heures sur une horloge, mais en 3D avec rotateY + translateZ)
    //  - le conteneur "ring" tourne en continu (rotation automatique)
    //  - l'utilisateur peut glisser le doigt pour ajouter sa propre
    //    rotation par dessus (rotationManuelle)
    //  - chaque élément monte aussi verticalement en boucle (translateY)
    //  - chaque élément a un DELAI d'apparition propre : il reste invisible
    //    et immobile tant que son délai n'est pas écoulé, puis il apparaît
    //    en fondu et commence à monter. Cela évite que tout le monde
    //    apparaisse en même temps au premier tour.

    const RADIUS = 520; // distance des bulles par rapport au centre (plus grand = moins de chevauchement)
    let ringItems = [];
    let ringAngle = 0;        // rotation automatique cumulée
    let manualOffset = 0;     // rotation ajoutée par le glissement du doigt
    let autoSpeed = 0.06;     // vitesse de rotation automatique (degrés/frame)

    // mélange aléatoire (Fisher-Yates) pour ne pas avoir tous les longs
    // textes ou toutes les images groupés côte à côte sur le cercle
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildRingContent() {
      // on mélange bulles de texte et images dans le même cercle
      let items = [];
      BUBBLE_MESSAGES.forEach(text => items.push({ type: 'bubble', content: text }));
      RING_IMAGES.forEach(src => items.push({ type: 'image', content: src }));
      items = shuffleArray(items);

      const total = items.length;
      // délai total sur lequel on étale les apparitions (en frames, ~60/s)
      const spreadFrames = total * 45;

      items.forEach((item, i) => {
        const el = document.createElement('div');
        el.className = 'ring-item';

        if (item.type === 'bubble') {
          el.innerHTML = `<div class="ring-bubble">${item.content}</div>`;
        } else {
          el.innerHTML = `<img class="ring-image" src="${item.content}">`;
        }

        // angle fixe réparti uniformément sur 360°
        const angle = (360 / total) * i;
        // décalage vertical de départ aléatoire, pour ne pas avoir
        // tous les éléments alignés à la même hauteur
        const startY = Math.random() * 500 + 100;
        const speed = Math.random() * 0.4 + 0.3; // vitesse de montée propre à chaque élément

        // délai avant que cet élément commence à apparaître/monter,
        // réparti sur toute la durée du premier tour + un peu de hasard
        const delay = Math.floor((spreadFrames / total) * i + Math.random() * 30);

        ring.appendChild(el);
        ringItems.push({ el, angle, y: startY, speed, delay, revealed: false });
      });
    }

    function ringLoop() {
      ringAngle += autoSpeed;
      const totalAngle = ringAngle + manualOffset;

      ringItems.forEach(item => {
        if (!item.revealed) {
          if (item.delay > 0) {
            item.delay--;
            // reste positionné mais invisible tant que le délai n'est pas fini
            item.el.style.transform =
              `rotateY(${item.angle + totalAngle}deg) translateZ(-${RADIUS}px) translateY(${item.y}px)`;
            return;
          }
          item.revealed = true;
          item.el.style.opacity = '1';
        }

        item.y -= item.speed;
        if (item.y < -450) item.y = Math.random() * 300 + 400; // recyclage : repart du bas, hauteur variable

        item.el.style.transform =
          `rotateY(${item.angle + totalAngle}deg) translateZ(-${RADIUS}px) translateY(${item.y}px)`;
      });

      ringFrameId = requestAnimationFrame(ringLoop);
    }

    function startRing() {
      buildRingContent();
      ringLoop();
    }

    // glissement du doigt pour tourner manuellement le cercle
    let touchStartX = null;
    let manualOffsetAtTouchStart = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      manualOffsetAtTouchStart = manualOffset;
    });
    document.addEventListener('touchmove', (e) => {
      if (touchStartX === null) return;
      const deltaX = e.touches[0].clientX - touchStartX;
      // on convertit le déplacement en pixels en degrés de rotation
      manualOffset = manualOffsetAtTouchStart + deltaX * 0.3;
    });
    document.addEventListener('touchend', () => { touchStartX = null; });

    // ==================================================================
    // FEUX D'ARTIFICE AVEC DOUBLE EXPLOSION
    // ==================================================================
    function resizeFireworks() {
      fireworksCanvas.width = window.innerWidth;
      fireworksCanvas.height = window.innerHeight;
    }
    resizeFireworks();
    window.addEventListener('resize', resizeFireworks);

    const colors = ['#ff3b3b', '#ff8a00', '#ffd700', '#ffffff', '#ff6b6b', '#4fd1ff', '#c86bff', '#4dff9e'];

    class Rocket {
      constructor(x, targetY) {
        this.x = x;
        this.y = fireworksCanvas.height;
        this.targetY = targetY;
        this.speed = 1.6 + Math.random() * 1;
        this.dead = false;
        this.trail = [];
      }
      update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 14) this.trail.shift();
        this.y -= this.speed;
        if (this.y <= this.targetY) {
          this.dead = true;
          explode(this.x, this.y);
        }
      }
      draw() {
        for (let i = 0; i < this.trail.length; i++) {
          const p = this.trail[i];
          ctx.save();
          ctx.globalAlpha = (i / this.trail.length) * 0.6;
          ctx.fillStyle = '#ffe9a8';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffe9a8';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // particule d'explosion. canExplodeAgain = true -> particule de 1er niveau,
    // qui pourra elle-même exploser une seconde fois en cours de trajectoire
    class Particle {
      constructor(x, y, canExplodeAgain) {
        this.x = x; this.y = y;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 2.8 + 1.8;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.gravity = 0.05;
        this.size = Math.random() * 2.5 + 1.5;
        this.decay = Math.random() * 0.005 + 0.003;
        this.trail = [];

        // seule une partie des particules de 1er niveau ré-explosera
        this.canExplodeAgain = canExplodeAgain;
        this.willReExplode = canExplodeAgain && Math.random() < 0.08; // 8% de chance (moins fréquent)
        this.reExplodeIn = Math.random() * 25 + 15; // délai en frames avant la 2e explosion
        this.age = 0;
        this.hasReExploded = false;
      }
      update() {
        this.age++;
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 10) this.trail.shift();
        this.vy += this.gravity;
        this.vx *= 0.99;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;

        // déclenche la seconde explosion au bon moment
        if (this.willReExplode && !this.hasReExploded && this.age >= this.reExplodeIn) {
          this.hasReExploded = true;
          miniExplode(this.x, this.y);
          this.alpha = 0; // la particule d'origine disparaît, remplacée par la mini-explosion
        }
      }
      draw() {
        for (let i = 0; i < this.trail.length; i++) {
          const p = this.trail[i];
          const trailAlpha = (i / this.trail.length) * this.alpha;
          ctx.save();
          ctx.globalAlpha = Math.max(trailAlpha, 0);
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, this.size * 0.6, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.save();
        ctx.globalAlpha = Math.max(this.alpha, 0);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    let rockets = [];
    let particles = [];

    // explosion principale (1er niveau) -> certaines pourront re-exploser
    function explode(x, y) {
      const count = 60 + Math.floor(Math.random() * 25);
      for (let i = 0; i < count; i++) particles.push(new Particle(x, y, true));
    }

    // mini-explosion (2e niveau) -> plus petite, ne re-explose jamais
    function miniExplode(x, y) {
      const count = 8 + Math.floor(Math.random() * 8);
      for (let i = 0; i < count; i++) {
        const p = new Particle(x, y, false);
        p.size *= 0.6; // particules plus petites pour la 2e explosion
        particles.push(p);
      }
    }

    function animateFireworks() {
      ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
      rockets.forEach(r => { r.update(); r.draw(); });
      rockets = rockets.filter(r => !r.dead);
      particles.forEach(p => { p.update(); p.draw(); });
      particles = particles.filter(p => p.alpha > 0);
      animationFrameId = requestAnimationFrame(animateFireworks);
    }
    animateFireworks();

    function launchRocket() {
      const x = Math.random() * fireworksCanvas.width * 0.7 + fireworksCanvas.width * 0.15;
      const targetY = Math.random() * fireworksCanvas.height * 0.4 + fireworksCanvas.height * 0.1;
      rockets.push(new Rocket(x, targetY));
    }

    function startFireworksShow() {
      const rocketInterval = trackInterval(setInterval(launchRocket, 1300));
      trackTimeout(setTimeout(() => clearInterval(rocketInterval), SHOW_DURATION * 1000));
    }

    // ==================================================================
    // BOUTON CLOSE
    // ==================================================================
    closeBtn.addEventListener('click', () => {
      finalBlack.classList.add('show');
      trackTimeout(setTimeout(stopEverything, 2000));
    });
  </script>

</body>
</html>
