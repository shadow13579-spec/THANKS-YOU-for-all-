<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Page surprise</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
    background: #000;
  }

  /* ---------- DIAPORAMA DE FOND (2 calques en fondu) ---------- */
  .bg-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: opacity 2s ease;
    z-index: 0;
  }
  #bg1 { opacity: 1; }
  #bg2 { opacity: 0; }

  #fireworks {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  #bubbles-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    overflow: hidden;
    pointer-events: none;
  }

  .bubble {
    position: absolute;
    bottom: -60px;
    padding: 10px 18px;
    background: rgba(20, 30, 45, 0.55);
    border: 1px solid #4fd1ff;
    border-radius: 20px;
    color: #eaffff;
    font-size: 20px;
    font-weight: 700;
    white-space: normal;
    max-width: 60vw;
    text-align: center;
    box-sizing: border-box;
    box-shadow: 0 0 8px #4fd1ff, 0 0 16px rgba(79, 209, 255, 0.5);
    text-shadow: 0 0 6px #4fd1ff;
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0);       opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-115vh);  opacity: 0; }
  }

  /* ---------- COUNTDOWN (bleu néon) ---------- */
  #countdown {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 8rem;
    color: #4fd1ff;
    text-shadow: 0 0 20px #4fd1ff, 0 0 40px #2ea8e0;
    z-index: 4;
    transition: opacity 0.3s ease;
  }
  .pulse { animation: pulse 0.5s ease; }
  @keyframes pulse {
    0%   { transform: translate(-50%,-50%) scale(0.5); opacity: 0; }
    50%  { transform: translate(-50%,-50%) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  }

  /* ---------- MESSAGE PRINCIPAL ---------- */
  #main-message {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 85%;
    text-align: center;
    font-size: 2.2rem;
    color: #eaffff;
    text-shadow: 0 0 12px #4fd1ff, 0 0 24px #4fd1ff;
    z-index: 4;
    opacity: 0;
    transition: opacity 3s ease; /* fondu LENT */
  }
  #main-message.show { opacity: 1; transition: opacity 0.8s ease; }
  #main-message.fade-out { opacity: 0; transition: opacity 3s ease; }

  /* ---------- ECRAN START ---------- */
  #start-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity 0.8s ease;
  }
  #start-btn {
    padding: 18px 50px;
    font-size: 1.6rem;
    font-weight: 700;
    color: #eaffff;
    background: rgba(20,30,45,0.6);
    border: 2px solid #4fd1ff;
    border-radius: 999px;
    box-shadow: 0 0 15px #4fd1ff;
    text-shadow: 0 0 8px #4fd1ff;
    cursor: pointer;
  }

  /* ---------- ECRAN DE CLOTURE ---------- */
  #closing-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    background: rgba(0,0,0,0.35);
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s ease;
  }
  #closing-screen.show {
    opacity: 1;
    pointer-events: auto;
  }
  #closing-message {
    width: 85%;
    text-align: center;
    font-size: 2rem;
    color: #eaffff;
    text-shadow: 0 0 12px #4fd1ff, 0 0 24px #4fd1ff;
  }
  #close-btn {
    padding: 12px 40px;
    font-size: 1.1rem;
    color: #eaffff;
    background: rgba(20,30,45,0.6);
    border: 2px solid #4fd1ff;
    border-radius: 999px;
    box-shadow: 0 0 12px #4fd1ff;
    cursor: pointer;
  }

  /* ---------- ECRAN NOIR FINAL (après clic Close) ---------- */
  #final-black {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
  }
  #final-black.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

  <div id="bg1" class="bg-layer"></div>
  <div id="bg2" class="bg-layer"></div>

  <canvas id="fireworks"></canvas>
  <div id="bubbles-layer"></div>

  <div id="countdown"></div>
  <div id="main-message">
    <!-- PLACEHOLDER : remplace ce texte par ton message principal -->
    Forever Grateful for You ❤️
  </div>

  <div id="closing-screen">
    <div id="closing-message">
      <!-- PLACEHOLDER : remplace ce texte par ton message de clôture -->
      Thank you for being here 💙
    </div>
    <button id="close-btn">Close</button>
  </div>

  <div id="start-screen">
    <button id="start-btn">Start</button>
  </div>

  <div id="final-black"></div>

  <!-- PLACEHOLDER : ta musique. Remplace "musique.mp3" par le nom exact de ton fichier uploadé -->
  <audio id="bg-audio" src="The_Kid_LAROI___Justin_Bieber_-_Stay__Instrumental_-Slowed___Reverb-(48k).m4a" loop></audio>

  <script>
    // ==================================================================
    // PLACEHOLDERS À MODIFIER TOI-MÊME
    // ==================================================================

    // liste des images du diaporama (uploade-les sur GitHub et mets les noms exacts ici)
    const BACKGROUND_IMAGES = [
      'IMG_20260809_135725_276.png', 'IMG_20260809_135637_764.png', 'image_ac4fbea5.png'
      // ajoute d'autres noms de fichiers ici, ex : 'photo2.jpg', 'photo3.jpg'
    ];

    // textes des bulles flottantes (à remplacer par ce que tu veux)
    const BUBBLE_MESSAGES = [
      "I have the power of the Miraculous",
      "And the more I am a genius 🤘😌",
      "I only answered because of Dear, that's all",
      "Dear ?",
      "Oh dear, I'm already sleepy, and you're going to bed.",
      "Haaa that",
      "Yes and if it was just a translation thing",
      "I am going to throw that phone to other countries",
      "A beginner's mistake",
      "So it was a mistake"
    ];

    // durée totale du spectacle de fusées, en secondes
    const SHOW_DURATION = 60;

    // ==================================================================
    // ELEMENTS
    // ==================================================================
    const startScreen   = document.getElementById('start-screen');
    const startBtn       = document.getElementById('start-btn');
    const countdownEl    = document.getElementById('countdown');
    const mainMessageEl  = document.getElementById('main-message');
    const closingScreen  = document.getElementById('closing-screen');
    const closeBtn       = document.getElementById('close-btn');
    const finalBlack      = document.getElementById('final-black');
    const audio           = document.getElementById('bg-audio');
    const bg1 = document.getElementById('bg1');
    const bg2 = document.getElementById('bg2');
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    const bubblesLayer = document.getElementById('bubbles-layer');

    // on garde une trace de TOUS les timers actifs pour pouvoir tout arrêter au clic Close
    let activeIntervals = [];
    let activeTimeouts = [];
    let animationFrameId = null;

    function trackInterval(id) { activeIntervals.push(id); return id; }
    function trackTimeout(id)  { activeTimeouts.push(id); return id; }

    function stopEverything() {
      activeIntervals.forEach(clearInterval);
      activeTimeouts.forEach(clearTimeout);
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      audio.pause();
    }

    // ==================================================================
    // ECRAN START
    // ==================================================================
    startBtn.addEventListener('click', () => {
      audio.play().catch(() => {}); // lancé ici = autorisé par le navigateur
      startScreen.style.opacity = '0';
      trackTimeout(setTimeout(() => { startScreen.style.display = 'none'; }, 800));
      startSequence();
    });

    // ==================================================================
    // COUNTDOWN
    // ==================================================================
    function startSequence() {
      let count = 3;
      function tick() {
        if (count > 0) {
          countdownEl.textContent = count;
        } else {
          countdownEl.textContent = '';
          showMainMessage();
          return;
        }
        countdownEl.classList.remove('pulse');
        void countdownEl.offsetWidth;
        countdownEl.classList.add('pulse');
        count--;
        trackTimeout(setTimeout(tick, 1000));
      }
      tick();
    }

    // ==================================================================
    // MESSAGE PRINCIPAL -> fondu lent pendant que le spectacle démarre
    // ==================================================================
    function showMainMessage() {
      mainMessageEl.classList.add('show');

      // le spectacle démarre tout de suite derrière le message
      startFireworksShow();
      startBubbles();
      startSlideshow();

      // après quelques secondes, le message s'efface lentement
      trackTimeout(setTimeout(() => {
        mainMessageEl.classList.remove('show');
        mainMessageEl.classList.add('fade-out');
      }, 4000));

      // à la fin de la durée du spectacle, on affiche l'écran de clôture
      trackTimeout(setTimeout(() => {
        closingScreen.classList.add('show');
      }, SHOW_DURATION * 1000));
    }

    // ==================================================================
    // DIAPORAMA DE FOND
    // ==================================================================
    function startSlideshow() {
      if (BACKGROUND_IMAGES.length <= 1) {
        bg1.style.backgroundImage = `url('${BACKGROUND_IMAGES[0]}')`;
        return;
      }
      let index = 0;
      bg1.style.backgroundImage = `url('${BACKGROUND_IMAGES[0]}')`;
      let showingBg1 = true;

      trackInterval(setInterval(() => {
        index = (index + 1) % BACKGROUND_IMAGES.length;
        const nextImage = `url('${BACKGROUND_IMAGES[index]}')`;

        if (showingBg1) {
          bg2.style.backgroundImage = nextImage;
          bg2.style.opacity = '1';
          bg1.style.opacity = '0';
        } else {
          bg1.style.backgroundImage = nextImage;
          bg1.style.opacity = '1';
          bg2.style.opacity = '0';
        }
        showingBg1 = !showingBg1;
      }, 6000)); // change d'image toutes les 6 secondes
    }

    // ==================================================================
    // FEUX D'ARTIFICE REALISTES (fusée qui monte + explosion + traînées)
    // ==================================================================
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const colors = ['#ff3b3b', '#ff8a00', '#ffd700', '#ffffff', '#ff6b6b', '#4fd1ff'];

    // une fusée qui monte avant d'exploser
    class Rocket {
      constructor(x, targetY) {
        this.x = x;
        this.y = canvas.height;
        this.targetY = targetY;
        this.speed = 6 + Math.random() * 2;
        this.dead = false;
      }
      update() {
        this.y -= this.speed;
        if (this.y <= this.targetY) {
          this.dead = true;
          explode(this.x, this.y);
        }
      }
      draw() {
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // particule d'explosion avec effet "saule pleureur" (retombe en traînée)
    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.gravity = 0.06;
        this.size = Math.random() * 2 + 1;
        this.flicker = Math.random() * 0.05;
      }
      update() {
        this.vy += this.gravity;
        this.vx *= 0.98; // ralentit progressivement (traînée réaliste)
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.01;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(this.alpha + (Math.random() * this.flicker), 0);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    let rockets = [];
    let particles = [];

    function explode(x, y) {
      const color = colors[Math.floor(Math.random() * colors.length)];
      const count = 70 + Math.floor(Math.random() * 30);
      for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      rockets.forEach(r => { r.update(); r.draw(); });
      rockets = rockets.filter(r => !r.dead);

      particles.forEach(p => { p.update(); p.draw(); });
      particles = particles.filter(p => p.alpha > 0);

      animationFrameId = requestAnimationFrame(animate);
    }
    animate();

    function launchRocket() {
      const x = Math.random() * canvas.width * 0.7 + canvas.width * 0.15;
      const targetY = Math.random() * canvas.height * 0.4 + canvas.height * 0.1;
      rockets.push(new Rocket(x, targetY));
    }

    function startFireworksShow() {
      // lance une fusée toutes les ~700ms pendant SHOW_DURATION secondes
      const rocketInterval = trackInterval(setInterval(launchRocket, 700));
      trackTimeout(setTimeout(() => clearInterval(rocketInterval), SHOW_DURATION * 1000));
    }

    // ==================================================================
    // BULLES DE MESSAGES
    // ==================================================================
    function createBubble(text) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      const leftPos = Math.random() * 30 + 5;
      bubble.style.left = leftPos + '%';
      const duration = Math.random() * 8 + 18;
      bubble.style.animationDuration = duration + 's';
      bubblesLayer.appendChild(bubble);
      trackTimeout(setTimeout(() => bubble.remove(), duration * 1000));
    }

    function startBubbles() {
      let i = 0;
      const bubbleInterval = trackInterval(setInterval(() => {
        createBubble(BUBBLE_MESSAGES[i % BUBBLE_MESSAGES.length]);
        i++;
      }, 2500));
      // on arrête aussi les nouvelles bulles à la fin du spectacle
      trackTimeout(setTimeout(() => clearInterval(bubbleInterval), SHOW_DURATION * 1000));
    }

    // ==================================================================
    // BOUTON CLOSE
    // ==================================================================
    closeBtn.addEventListener('click', () => {
      finalBlack.classList.add('show');
      trackTimeout(setTimeout(stopEverything, 2000)); // laisse le fondu noir se terminer avant de tout couper
    });
  </script>

</body>
</html>
